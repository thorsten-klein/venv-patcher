# Repo-wide hygiene gate. Run over the whole tree by `uv run poe pre-commit`,
# the first step of `uv run poe all`. Nothing installs an actual git hook --
# that stays a per-developer `pre-commit install` if you want it.
#
# Everything language-specific already has its own poe task backed by a version
# pinned in pyproject.toml's `lint` dependency group -- ruff, mypy, pyright,
# bandit, pip-audit, complexipy. Duplicating any of them here would mean a
# second, independently-pinned copy drifting from the one CI runs, so this file
# deliberately stays limited to the checks nothing else covers.
repos:
  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # --- whitespace -----------------------------------------------------
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ['--fix=lf']

      # --- parseability of the files that configure everything else -------
      - id: check-yaml
      - id: check-toml
      - id: check-json

      # --- python ---------------------------------------------------------
      - id: debug-statements
      - id: name-tests-test
        args: ['--pytest-test-first']

      # --- repo integrity -------------------------------------------------
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=500', '--enforce-all']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: forbid-submodules


# Configuration
#
# No default_language_version.python pin here (unlike the rest of this repo's
# floor-version-3.9 stance): these hooks don't run any of venv-patcher's own
# code, just generic file checks, and pinning to python3.9 specifically broke
# CI -- that interpreter isn't guaranteed to be on PATH as `python3.9` on a
# runner that never installed it, unlike the versions the test matrix
# actually requests through setup-uv.

# Minimum pre-commit version -- matches the floor pyproject.toml's `lint`
# dependency group pins.
minimum_pre_commit_version: '4.0.0'
