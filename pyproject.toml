[build-system]
requires = ["setuptools>=61", "setuptools-scm<7", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "venv-patcher"
dynamic = ["version"]
description = "Apply and track patches to packages installed in a Python virtual environment"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []
authors = [
    {name = "Thorsten Klein", email = "kleinkastel@googlemail.com"}
]
keywords = ["patch", "venv", "virtualenv", "site-packages", "pip"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
venv-patcher = "venv_patcher.cli:main"

[project.urls]
Homepage = "https://github.com/thorsten-klein/venv-patcher"
Documentation = "https://github.com/thorsten-klein/venv-patcher#readme"
Repository = "https://github.com/thorsten-klein/venv-patcher"
Issues = "https://github.com/thorsten-klein/venv-patcher/issues"

[dependency-groups]
lint = [
    "bandit>=1.8.0",
    "complexipy>=7.0.0",
    "mypy~=1.14",
    "pip-audit>=2.9.0",
    "pre-commit>=4.3.0",
    "pyright~=1.1",
    "ruff~=0.13",
]
test = [
    "coverage>=7.10",
    "pytest>=8.4,<10.0",
    "pytest-xdist>=3.0.0",
    "pytest-cov>=7.0",
]
dev = [
    "poethepoet~=0.37",
    {include-group = "lint"},
    {include-group = "test"},
]

[tool.coverage.report]
fail_under = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools]
packages = ["venv_patcher"]

[tool.setuptools_scm]
fallback_version = "0.1.0"

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH", "RET", "ARG", "C4", "RUF", "D"]
ignore = [
    "E501", # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# unused fixture/mock-callback arguments are idiomatic pytest, not a smell;
# a test's own name is its documentation, so docstrings aren't required.
"tests/*" = ["ARG001", "ARG002", "ARG005", "D"]

[tool.ruff.format]
quote-style = "preserve"
line-ending = "lf"
# Enable preview mode for Github Annotations added in 0.13.3
preview = true

[tool.complexipy]
paths = ["venv_patcher", "tests"]
max-complexity-allowed = 5
failed = true
color = "auto"
sort = "asc"

[tool.mypy]
python_version = "3.11"
files = ["venv_patcher"]

[tool.pyright]
pythonVersion = "3.11"
include = ["venv_patcher"]

[tool.bandit]
# scope to venv_patcher's own package, same as pyright/mypy
exclude_dirs = ["tests"]
# venv-patcher's whole job is orchestrating git as a subprocess -- these
# three fire on every single one of those call sites:
#   B404 -- merely importing subprocess
#   B603 -- subprocess.run called with a list argv and no shell=True
#           (that's the *safe* pattern these checks exist to push people towards)
#   B607 -- invoking a PATH-resolved executable ("git") rather than a
#           hardcoded absolute path, which would break on every dev machine
skips = ["B404", "B603", "B607"]

[tool.poe.tasks]
all = ["pre-commit", "lint", "format", "mypy", "pyright", "bandit", "pip-audit", "complexity", "test"]
"pre-commit" = "pre-commit run --all-files --show-diff-on-failure"
format = "ruff format ."
lint = "ruff check ."
mypy = "mypy"
pyright = "pyright"
bandit = "bandit -c pyproject.toml -r venv_patcher"
"pip-audit" = "pip-audit --skip-editable"
complexity = "complexipy"
test = {cmd = "pytest -v -n=auto -W error --cov-config=pyproject.toml --cov=venv_patcher --junitxml=junit.xml -o junit_family=legacy --cov-report=term-missing --cov-report=html --cov-report=xml", env = {PYTHONIOENCODING = "utf-8"}}

clean = "rm -rf dist/ build/ *.egg-info venv_patcher.egg-info"
build = ["clean", {cmd = "uv build"}]
publish-test = {cmd = "uv publish --publish-url https://test.pypi.org/legacy/"}
publish = "uv publish"
