name: Close linked issues

# GitHub closes "Fixes #N" issues only when a PR is merged into main.
# A stacked PR is merged into another branch, so its issues stay open.
# This closes them too.
#
# pull_request_target runs this file from main, also for a PR into
# another branch. It checks out no code, and reads the PR body only
# through an env var, so this is safe.
on:
  pull_request_target:
    types: [closed]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged && github.event.pull_request.base.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Close the issues the PR fixes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BODY: ${{ github.event.pull_request.body }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # the same keywords GitHub uses: close(s/d), fix(es/ed), resolve(s/d)
          for n in $(printf '%s' "$BODY" | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+' | grep -oE '[0-9]+$' | sort -u); do
            gh issue close "$n" --comment "Fixed by #$PR." || true
          done
