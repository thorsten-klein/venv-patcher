name: Publish to PyPI

on:
  push:
    tags: ['*.*.*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Setup project
        run: uv sync --frozen
      - name: Build package
        # --no-sync skips uv run's own implicit sync of the already-locked
        # environment; the "uv build" the poe task shells out to still runs
        # (and still builds venv-patcher itself) -- that's this job's point.
        run: uv run --no-sync poe build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/venv-patcher/
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
